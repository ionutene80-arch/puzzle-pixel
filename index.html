<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找词语游戏 - 作文纸</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    background: #f5f7fb;
    color: #222;
  }
  h1 { text-align: center; margin: 0 0 16px; }
  .setup {
    max-width: 900px;
    margin: 0 auto 20px;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    line-height: 1.6;
    resize: vertical;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  button {
    padding: 8px 16px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover { background: #1d4ed8; }
  #status { color: #555; font-size: 14px; }
  .board-container {
    max-width: 100%;
    overflow-x: auto;
    margin: 0 auto 20px;
    display: flex;
    justify-content: center;
  }
  .board {
    display: flex;
    flex-wrap: wrap;
    width: 560px; /* 20 字 × 28px */
    user-select: none;
    touch-action: none;
    background: white;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .char {
    width: 28px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: background .1s, color .1s;
    border-radius: 4px;
  }
  .char.selecting { background: #93c5fd; color: #1e3a8a; }
  .char.found { background: #86efac; color: #14532d; }
  .words {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .words h3 { margin: 0 0 12px; }
  #wordList { display: flex; flex-wrap: wrap; gap: 8px; }
  #wordList span {
    padding: 4px 10px;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
    font-size: 14px;
  }
  #wordList span.done {
    background: #dcfce7;
    color: #166534;
    text-decoration: line-through;
  }
</style>
</head>
<body>
<h1>找词语游戏 - 作文纸</h1>

<div class="setup">
  <p>在下方输入答案，一行一个词，正常顺序。点击“加载答案”后，在字阵中拖动选择词语。</p>
  <textarea id="wordsInput" placeholder="例如：&#10;千与千寻&#10;头号玩家&#10;绿皮书"></textarea>
  <div class="controls">
    <button id="loadBtn">加载答案</button>
    <button id="resetBtn">重置游戏</button>
    <span id="status">等待加载答案</span>
  </div>
</div>

<div class="board-container">
  <div id="board" class="board"></div>
</div>

<div class="words">
  <h3>要找到的词语</h3>
  <div id="wordList"></div>
</div>

<script>
// ============================================================
// 这里放入你提供的 Word 文件内容（作文纸文字）
// ============================================================
const TEXT = `勋出恐鼠野草莓沌投光变形记捕闪美寻千与千头号玩家花了动夫熊猫绿皮书少华相之冰倾灵丽在梦人青红霸谷故园风雨妮古菲伊见人情年芳声智城雪心老内环超鸟人王海滩起造雷芝加哥罚偏感样时泳者之心灵奇旅友游脱能之别底林谍中谍万丝丽爱与花束般的恋爱乐之城缘红记台戏陆姬小森林影魅箭物简智慢罪奥维尔号像恩音翠石日假马罗暗战纵疾重左耳穿怪理店傲赎救的克申肖指伯翡主公灵幽日夏天队重健倾食心房客论饭鱼汉尼拔羊的环德公八犬忠里欧洛工纱生听男神坐而地席象大坦小小狮子王小妇人佳世乱写特假面友女才天爱久弥新红泰斯猪丹麦女孩姐孩小笨迹奇脑的波盆子孩巫杀天一间灯猪里肯佩悉的烧冬男天空之城头低网蒂利海芭死呼道房笼追莫戈兰奇达怪燃迹春光乍泄围俗怪族海珀哈比字亡壁高梵忆迪尔弗拉多布奇的城光月球小鬼当家神边尔名勒大高花繁似里博普诺兰虹班物格光升说她对有偷误错的边河加地狂少水阿穿婆阿奥牛动格语棋王之剧喜奶小丑你移曼流州战路潘年尼靴坡凡放狂心动某坏国黑事爸家为以何动别彻人宇末德华派子镜达疯甜然之破种杂暗唤爸想请妞小城大纳斯戒代彼德免的龙缘护蜜怦敌石菊物物呼吧梦毒青律堡杀误尼紫皇岸爱帕猫奇守奇蜜无问西东好质的跤日蛇舌政着逃事威拼帝花于汝洋太幻遇发咒叶枯线瓜兽性摔白告查俏活大桥断贴海黄刀海死蒙浮漂戒魔女单无无餐野边路理我佳生之欲魂幸的小剪洋上杀一一流睡花清各问战争与和平是人的安血钻福水鞋青之炎钢天代罪沉茶愿之的道事巧女生丽家尔传与球溺香子午歌后天琴宗父教默遗辈兰勒克鱼人美小行黛地亮月火偷物礼的房号七师毒命绝的赫宇力德静龙传正飞阿甘正传花漾少女杀人事件虫液将谢穆羔工小寂辛小丑回魂象的背景`;

// ============================================================

const boardEl = document.getElementById('board');
const wordListEl = document.getElementById('wordList');
const statusEl = document.getElementById('status');
const loadBtn = document.getElementById('loadBtn');
const resetBtn = document.getElementById('resetBtn');
const wordsInput = document.getElementById('wordsInput');

let chars = [];
let answerWords = [];
let foundWords = new Set();
let selecting = false;
let startIndex = null;
let currentSelecting = [];

function renderBoard() {
  boardEl.innerHTML = '';
  chars = [];
  for (let i = 0; i < TEXT.length; i++) {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = TEXT[i];
    span.dataset.index = i;
    boardEl.appendChild(span);
    chars.push(span);
  }
}

function renderWordList() {
  wordListEl.innerHTML = '';
  answerWords.forEach(word => {
    const span = document.createElement('span');
    span.textContent = word;
    if (foundWords.has(word)) span.classList.add('done');
    wordListEl.appendChild(span);
  });
}

function clearSelecting() {
  currentSelecting.forEach(idx => {
    if (chars[idx]) chars[idx].classList.remove('selecting');
  });
  currentSelecting = [];
}

function clearFound() {
  chars.forEach(span => span.classList.remove('found'));
  foundWords.clear();
  renderWordList();
}

function loadAnswers() {
  const lines = wordsInput.value.split(/[\n,，]+/);
  answerWords = lines
    .map(w => w.trim().replace(/[《》"'“”‘’]/g, ''))
    .filter(Boolean);
  foundWords.clear();
  clearFound();
  renderWordList();
  statusEl.textContent = `已加载 ${answerWords.length} 个词语`;
}

function checkSelection(min, max) {
  const selectedChars = [];
  for (let i = min; i <= max; i++) {
    selectedChars.push(TEXT[i]);
  }
  const str = selectedChars.join('');
  const rev = [...selectedChars].reverse().join('');

  let matched = null;
  for (const word of answerWords) {
    if (foundWords.has(word)) continue;
    if (word === str || word === rev) {
      matched = word;
      break;
    }
  }

  if (matched) {
    foundWords.add(matched);
    for (let i = min; i <= max; i++) {
      chars[i].classList.remove('selecting');
      chars[i].classList.add('found');
    }
    renderWordList();
    if (foundWords.size === answerWords.length) {
      statusEl.textContent = '全部找到！🎉';
    } else {
      statusEl.textContent = `找到：${matched}`;
    }
  } else {
    clearSelecting();
  }
}

// 鼠标事件
boardEl.addEventListener('mousedown', e => {
  const span = e.target.closest('.char');
  if (!span) return;
  e.preventDefault();
  selecting = true;
  startIndex = +span.dataset.index;
  clearSelecting();
  span.classList.add('selecting');
  currentSelecting = [startIndex];
});

boardEl.addEventListener('mouseover', e => {
  if (!selecting) return;
  const span = e.target.closest('.char');
  if (!span) return;
  const currentIndex = +span.dataset.index;
  const min = Math.min(startIndex, currentIndex);
  const max = Math.max(startIndex, currentIndex);
  clearSelecting();
  for (let i = min; i <= max; i++) {
    chars[i].classList.add('selecting');
    currentSelecting.push(i);
  }
});

document.addEventListener('mouseup', () => {
  if (!selecting) return;
  selecting = false;
  if (currentSelecting.length > 0) {
    const min = Math.min(...currentSelecting);
    const max = Math.max(...currentSelecting);
    checkSelection(min, max);
  }
  startIndex = null;
  clearSelecting();
});

// 触摸事件
boardEl.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const span = el && el.closest('.char');
  if (!span) return;
  e.preventDefault();
  selecting = true;
  startIndex = +span.dataset.index;
  clearSelecting();
  span.classList.add('selecting');
  currentSelecting = [startIndex];
}, { passive: false });

boardEl.addEventListener('touchmove', e => {
  if (!selecting) return;
  e.preventDefault();
  const touch = e.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const span = el && el.closest('.char');
  if (!span) return;
  const currentIndex = +span.dataset.index;
  const min = Math.min(startIndex, currentIndex);
  const max = Math.max(startIndex, currentIndex);
  clearSelecting();
  for (let i = min; i <= max; i++) {
    chars[i].classList.add('selecting');
    currentSelecting.push(i);
  }
}, { passive: false });

document.addEventListener('touchend', () => {
  if (!selecting) return;
  selecting = false;
  if (currentSelecting.length > 0) {
    const min = Math.min(...currentSelecting);
    const max = Math.max(...currentSelecting);
    checkSelection(min, max);
  }
  startIndex = null;
  clearSelecting();
});

resetBtn.addEventListener('click', () => {
  clearFound();
  clearSelecting();
  statusEl.textContent = '已重置，可以重新找词';
});

loadBtn.addEventListener('click', loadAnswers);

renderBoard();
</script>
</body>
</html>
